[package]
name = "qinglan-win"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
qinglan-engine = { path = "../qinglan-engine" }

[features]
# Dev-only: the counting allocator and the `--mem` breakdown (`memstats`); not in release builds.
mem-stats = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Page text and encoded bytes are hostile (CLAUDE.md "Robustness"): no panics from this crate either.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
