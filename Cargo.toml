[workspace]
resolver = "3"
members = ["crates/qinglan-engine", "crates/qinglan-win", "crates/qinglan-app", "crates/qinglan", "crates/qinglan-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# No panic = "abort": a page must be able to catch_unwind (L1-TASK 1c).

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Hot code stays at opt-level 3: qinglan-engine (HTML parse, style, layout, paint) and the binary crates (`qinglan`, a thin
# shell around qinglan-app, and `qinglan-cli`). Per-package levels work under fat LTO, but the final LTO pass runs at the
# opt-level of the crate linked last, so the binary crates must stay at 3 or the engine slows down by ~15%. The Windows
# glue is size-optimized ("z"), and so is qinglan-app ("s", step 2f-1: it is the event handling and bookkeeping around the
# engine, 17 KB smaller; its draw/scroll loop is a thin caller of the engine's raster). See docs/decisions.md, "Hot and
# cold code" and "2f-1".
[profile.release.package.qinglan-win]
opt-level = "z"

[profile.release.package.qinglan-app]
opt-level = "s"
