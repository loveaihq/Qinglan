<!--
viewport: 300x300
Padding, border and margin of inline boxes (CSS2 8.3, 10.8.1, css-inline-3 4). Horizontal edges take room in the line;
vertical ones do not change the line height but the box (background, border) is drawn around the content area (ascent +
descent = 10) plus its padding and border. Font 10px/10px Ahem, body margin 0.

sa  "ab" 0..20, then the span's start edge: margin 3 + border 2 + padding 5 = 10, "cd" at 30..50, end edge 5+2+3 = 10,
    "ef" at 60. The span's border box runs from 20+3 = 23 to 60-3 = 57 (34 wide), top = content top (0) - border 2 = -2,
    14 high (10 + 2 + 2).
sb  width 60: "aa " (30) + start edge (5+1 = 6) + "bb" (20) = 56 fits, " cc" would reach 86: break. Line 1 holds the start of the
    span: box from x=30 to 56 (26 wide), 12 high (10 + 1 + 1) at y-1, first only. Line 2 "cc dd" is 50 wide + end edge 6 = 56:
    box from 0 to 56, last only. "ee" goes to line 3. Lines at y = 10, 20, 30.
sc  negative margins -5 on both sides: "l" at 10-5 = 5, "m" at 5+10-5 = 10.
sd  a block inside the span splits it into two pieces (CSS2 9.2.1.1): piece 1 "p" has the start edge (4+1 = 5) and sits in an
    anonymous block (y=50): "p" at x=5, box 0..15 (15 wide) [first]; the block (50x10) at y=60; piece 2 "q" at y=70 with the
    end edge after it: box 0..15 [last].
Heights: 10, 30, 10, 30. Page 80 high.
check: line (0,0 200x10) :: baseline=8
check: text "ab" :: (0,0 20x10)
check: text "cd" :: (30,0 20x10)
check: text "ef" :: (60,0 20x10)
check: inline span#sa :: (23,-2 34x14) [first last]
check: block div#sb :: (0,10 60x30)
check: text "aa :: (0,10 30x10)
check: inline span#sbs :: (30,9 26x12) [first]
check: text "bb" :: (36,10 20x10)
check: text "cc dd" :: (0,20 50x10)
check: inline span#sbs (0,19 :: 56x12) [last]
check: text "ee" :: (0,30 20x10)
check: text "k" :: (0,40 10x10)
check: text "l" :: (5,40 10x10)
check: text "m" :: (10,40 10x10)
check: text "p" :: (5,50 10x10)
check: inline span#s1 :: (0,49 15x12) [first]
check: block div#blk :: (0,60 50x10)
check: text "q" :: (0,70 10x10)
check: inline span#s1 (0,69 :: 15x12) [last]
check: block body :: (0,0 300x80)
-->

<div style="width:200px">k<span style="margin:0 -5px">l</span>m</div>
