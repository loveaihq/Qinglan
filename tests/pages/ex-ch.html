<!--
viewport: 400x300
ex and ch come from the platform's font metrics (css-values-4 6.1): the test font has x-height 0.8em and the advance of
"0" is 1em. (Without a platform they are 0.5em.) Body margin 0.

e1  font 20px: width 5ex = 5 x 16 = 80, height 2ch = 2 x 20 = 40.            (0,0 80x40)
e2  font 10px: width 10ch = 100, height 3ex = 3 x 8 = 24.                      (0,40 100x24)
e3  font 10px: margin-left 1ex = 8, the width fills the rest: 400-8 = 392.     (8,64 392x10)
e5  font-size 2ex inside a 10px parent: the ex of the parent (8px) counts: 16px. Then width 1ch = 16 and height 1em = 16.
e4 is the 16 high parent at y=74.
check: block div#e1 :: (0,0 80x40)
check: block div#e2 :: (0,40 100x24)
check: block div#e3 :: (8,64 392x10)
check: block div#e4 :: (0,74 400x16)
check: block div#e5 :: (0,74 16x16)
-->
<!doctype html>
<style>
body { margin: 0; font: 10px/10px Ahem }
</style>
<div id="e1" style="font-size:20px;width:5ex;height:2ch"></div>
<div id="e2" style="font-size:10px;width:10ch;height:3ex"></div>
<div id="e3" style="font-size:10px;margin-left:1ex;height:10px"></div>
<div id="e4" style="font-size:10px"><div id="e5" style="font-size:2ex;width:1ch;height:1em"></div></div>
