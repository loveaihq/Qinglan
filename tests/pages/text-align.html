<!--
viewport: 200x400
text-align left, center, right, start, end (css-text-3 7.1). Every div is 100px wide, font 10px/10px; "abc" is 30 wide.
(justify is not laid out yet: step 1b-2.)

l       left: x=0.                          c  centre: (100-30)/2 = 35.            r  right: 100-30 = 70.
s       start = left, e end = right (layer 1 has no right-to-left layout).
ov      "abcdefghijkl" is 120 wide and cannot be centred; overflowing content is start-aligned: x=0.
two     "abcd efgh ij" wraps after "efgh": line 1 "abcd efgh" is 90 wide, centred at (100-90)/2 = 5; line 2 "ij"
        is 20 wide, centred at 40.
half    width 105: (105-30)/2 = 37.5.
nest    the alignment is inherited by the span: "abc" + " de" is 60 wide, starts at (100-60)/2 = 20: "abc" at 20,
        " de" at 50.
hang    pre-wrap, right aligned, width 50: "ab   cd" wraps after the spaces; the three spaces hang and are not
        counted for alignment: the line "ab   " (fragment 50 wide) is aligned as a 20 wide line: x=50-20=30, its
        spaces stick out to the right. "cd" is 20 wide, x=30.
check: text "abc" (0,0 :: (0,0 30x10)
check: text "abc" (35,10 :: (35,10 30x10)
check: text "abc" (70,20 :: (70,20 30x10)
check: text "abc" (0,30 :: (0,30 30x10)
check: text "abc" (70,40 :: (70,40 30x10)
check: text "abcdefghijkl" :: (0,50 120x10)
check: block div#two :: (0,60 100x20)
check: text "abcd efgh" :: (5,60 90x10)
check: text "ij" :: (40,70 20x10)
check: block div#half :: (0,80 105x10)
check: text "abc" (37.5,80 :: (37.5,80 30x10)
check: text "abc" (20,90 :: (20,90 30x10)
check: text " de" :: (50,90 30x10)
check: block div#hang :: (0,100 50x20)
check: text "ab   " :: (30,100 50x10)
check: text "cd" :: (30,110 20x10)
-->
<!doctype html>
<style>
body { margin: 0; font: 10px/10px Ahem }
div { width: 100px }
</style>
<div id="l" style="text-align:left">abc</div>
<div id="c" style="text-align:center">abc</div>
<div id="r" style="text-align:right">abc</div>
<div id="s" style="text-align:start">abc</div>
<div id="e" style="text-align:end">abc</div>
<div id="ov" style="text-align:center">abcdefghijkl</div>
<div id="two" style="text-align:center">abcd efgh ij</div>
<div id="half" style="text-align:center;width:105px">abc</div>
<div id="nest" style="text-align:center"><span>abc</span> de</div>
<div id="hang" style="white-space:pre-wrap;text-align:right;width:50px">ab   cd</div>
