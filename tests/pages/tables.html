<!--
Tables (CSS2 chapter 17, step 2a-2). Font 10px/10px, body margin 0, viewport 800x600. Every glyph is a 10px square.

t1  automatic layout (17.5.2.2), no spacing, no padding: column 0 = max(30 "aaa", 10 "c") = 30, column 1 = max(20 "bb", 40 "dddd") = 40,
    both rows are 10 high: table (0,0 70x20); a (0,0 30x10), b (30,0 40x10), c (0,10 30x10), d (30,10 40x10).
t2  table-layout: fixed with width 100 (17.5.2.1), border-spacing 0: column 0 is 30 from <col style="width:30px">, the other two share
    the 70 left: 35 each. The table is at 20 + margin-top 10: (0,30 100x10); e (0,30 30x10), f (30,30 35x10), g (65,30 35x10).
t3  border=1, cellspacing=2, cellpadding=1, a caption on top (17.4), x over two rows, yy over two columns. Cells: x, z, w are 10 + 2 padding
    + 2 border = 14 wide, yy needs 20 + 4 = 24 < 14 + 2 + 14. The grid: 2 + 14 + 2 + 14 + 2 + 14 + 2 = 50 wide, plus the 1px table
    border on both sides = 52. Rows 14 + 14 high: 2 + 14 + 2 + 14 + 2 = 34 + 2 = 36, plus the 10 high caption = 46. t3 starts at 40 + margin 10 = 50:
    table (0,50 52x46), caption (0,50 52x10) with "cap" centred: x = (52 - 30) / 2 = 11. The row group starts inside the border and the
    spacing: (3,63) 46x30; x spans two rows: (3,63 14x30), yy: (19,63 30x14), z (19,79 14x14), w (35,79 14x14). x is vertically
    centred (td inherits `middle` from the row group): 30 - 14 = 16 spare, 8 above: its text at 63 + 1 + 1 + 8 = 73, x = 3 + 2 = 5.
t4  vertical-align top / middle / bottom (17.5.3) in a row 30 high (the first cell has a 30 high block): the texts at 96, 96 + 10, 96 + 20.
t5  vertical-align: baseline: "A" is 20px (baseline 16), "b" 10px (baseline 8): the row is 16 + max(4, 2) = 20 high and "b" is 8 lower
    than the top: t5 at 126, "A" (0,126 20x20), "b" (20,134 10x10).
check: block table#t1 :: (0,0 70x20) [display:table]
check: block td#a :: (0,0 30x10)

check: block td#yy :: (19,63 30x14)

-->
